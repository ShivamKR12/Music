name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
          build-essential ccache automake

    - name: Install Buildozer, Cython & pin Pip
      run: |
        python -m pip install --upgrade "pip<25.0" setuptools wheel
        python -m pip install "cython<3.0" buildozer

    - name: Verify buildozer.spec and Recipes
      run: |
        ls -la buildozer.spec
        cat buildozer.spec
        ls -la recipes/kivymd
        ls -la recipes/materialshapes

    - name: Cache Buildozer Global Directory (SDK / NDK)
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-v2-${{ hashFiles('buildozer.spec', 'recipes/**') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-v2-

    - name: Build with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KivyMusicApp-APK
        path: bin/*.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: bin/*.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
